services:
  postgres:
    image: postgres:16
    container_name: banking-transactions-postgres
    restart: always
    environment:
      POSTGRES_DB: banking_transactions_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: passwd111
    ports:
      - "5241:5232"
    volumes:
      - "banking-transactions_db:/var/lib/postgresql/data"
      - "./init-scripts:/docker-entrypoint-initdb.d"


  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kafka_bt
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # запускаем kafka в kraft режиме
      - KAFKA_CFG_PROCESS_ROLES:broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS=0

    volumes:
      - "kafka_data:/bitnami/kafka"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

volumes:
  kafka_data:
    driver: local