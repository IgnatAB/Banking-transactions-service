services:
  postgres:
    image: postgres:16
    container_name: banking-transactions
    restart: always
    environment:
      POSTGRES_DB: banking_transactions_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: passwd111
    ports:
      - "5441:5432"
    volumes:
      - "banking_transactions_db:/var/lib/postgresql/data"
      - "./init-scripts:/docker-entrypoint-initdb.d"


  # ======================== Kafka Cluster (3 brokers, Kraft mode) ========================
  #  Для локальной разработки можно оставить только kafka1 и replication.factor=1
  #  Для примера отказоустойчивого кластера — запускаем kafka1..kafka3 и replication.factor=3

  kafka1:
    image: docker.io/bitnami/kafka:3.7
    container_name: kafka1
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # запускаем kafka в kraft режиме
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka1:19092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT

      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # я генерил отдельно через
      # docker run --rm bitnami/kafka:3.7 kafka-storage.sh random-uuid
      # параметр может называться по-разному в зависимости от разных источников образа,
      # например, в vanilla Kafka это будет KAFKA_CLUSTER_ID
      - KAFKA_KRAFT_CLUSTER_ID=DM-XlNO0RqiKI6IqIfC2nQ

    volumes:
      - "kafka1_data:/bitnami/kafka"

  kafka2:
    image: docker.io/bitnami/kafka:3.7
    container_name: kafka2
    ports:
      - "9094:9092"
      - "9095:9093"
    environment:
      # запускаем kafka в kraft режиме
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka2:19092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT

      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS=0

      - KAFKA_KRAFT_CLUSTER_ID=DM-XlNO0RqiKI6IqIfC2nQ

    volumes:
      - "kafka2_data:/bitnami/kafka"

    depends_on:
      - kafka1

  kafka3:
    image: docker.io/bitnami/kafka:3.7
    container_name: kafka3
    ports:
      - "9096:9092"
      - "9097:9093"
    environment:
      # запускаем kafka в kraft режиме
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka3:19092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT

      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS=0

      - KAFKA_KRAFT_CLUSTER_ID=DM-XlNO0RqiKI6IqIfC2nQ

    volumes:
      - "kafka3_data:/bitnami/kafka"

    depends_on:
      - kafka2

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=localhost:9092

    depends_on:
      - kafka1
      - kafka2
      - kafka3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - kafka1
      - postgres

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  kafka1_data:
    driver: local
  kafka2_data:
    driver: local
  kafka3_data:
    driver: local
  banking_transactions_db:
    driver: local