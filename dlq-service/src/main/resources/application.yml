server:
  port: 8084

spring:
  application:
    name: dlq-service

  datasource:
    url: jdbc:postgresql://localhost:5441/banking_transactions_db
    username: user
    password: passwd111
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yml

  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    consumer:
      group-id: dlq-service-group
      auto-offset-reset: earliest

topics:
  main: transactions
  approved: approved-transactions
  rejected: rejected-transactions
  dlq: transactions-dlq

management:
  endpoints:
    web:
      exposure:
        include: ["health","prometheus", "metrics"]

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  file:
    path: logs
  level:
    root: INFO
    ru.ignatab: DEBUG
    org.springframework: WARN
    org.apache.kafka: WARN