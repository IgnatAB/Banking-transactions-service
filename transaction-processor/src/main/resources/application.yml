server:
  port: 8082

spring:
  application:
    name: transaction-processor
  datasource:
    url: jdbc:postgresql://localhost:5441/banking_transactions_db
    username: user
    password: passwd111
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: banking_transactions
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yml
    default_schema: banking_transactions

  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    consumer:
      group-id: transaction-processor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false   # не добавлять тип в заголовки

management:
  endpoints:
    web:
      exposure:
        include: ["health","prometheus", "metrics"]

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

topics:
  main: transactions
  approved: approved-transactions
  rejected: rejected-transactions
  dlq: transactions-dlq